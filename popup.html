<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maeve</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 270px;
      padding: 16px;
      background: #151518;
      color: #f4f4f5;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #27272a;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.3px;
    }
    .badge {
      font-size: 9.5px;
      background: #4f46e5;
      padding: 2px 6px;
      border-radius: 8px;
      color: white;
      font-weight: 500;
    }
    .toggle-btn {
      width: 100%;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .toggle-btn:hover {
      background: #4338ca;
    }
    .status-card {
      background: #1f1f24;
      border: 1px solid #2e2e36;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 11.5px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-label {
      color: #9ca3af;
    }
    .status-val {
      font-weight: 500;
      color: #e5e7eb;
    }
    .pill {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 500;
    }
    .pill-green {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .pill-amber {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .hint {
      font-size: 10.5px;
      color: #71717a;
      margin-top: 12px;
      line-height: 1.4;
      text-align: center;
    }
    .hint kbd {
      background: #27272a;
      border: 1px solid #3f3f46;
      padding: 1px 4px;
      border-radius: 3px;
      color: #e4e4e7;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <img src="icons/icon48.png" width="22" height="22" style="border-radius: 5px; object-fit: contain;" alt="Maeve" />
      <span>Maeve</span>
    </div>
    <span class="badge">AI HUD</span>
  </div>

  <button class="toggle-btn" id="btn-toggle">
    ⚡ Toggle Maeve
  </button>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Model</span>
      <span class="status-val">GPT-OSS 120B (Groq)</span>
    </div>
    <div class="status-row">
      <span class="status-label">Configuration</span>
      <span class="pill pill-green" id="config-status">Checking...</span>
    </div>
  </div>

  <div class="hint">
    Press <kbd>Alt+J</kbd> (Mac: <kbd>Cmd+Shift+K</kbd>) to summon Maeve anywhere.
  </div>

  <script src="popup.js"></script>
</body>
</html>
